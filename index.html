<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171B;
    --panel:#1C2025;
    --panel-raised:#20252B;
    --hairline:#2C3238;
    --paper:#EDEAE1;
    --muted:#8B9098;
    --muted-dim:#5C6167;
    --growth:#4C8A66;
    --growth-dim:#2A3D33;
    --necessary:#5B7089;
    --necessary-dim:#262F38;
    --flag:#C08A45;
    --flag-dim:#3A2F20;
    --income:#6FA684;
    --debt:#B15B48;
    --debt-dim:#3A2620;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:78px;
    position:relative;
  }
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--hairline);
  }
  header.top h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0 0 4px;
  }
  header.top p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }
  main{
    flex:1;
    padding:18px 20px 24px;
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* --- shared bits --- */
  .section-label{
    font-size:12px;
    color:var(--muted);
    margin:0 0 10px;
    font-family:'Inter',sans-serif;
    font-weight:500;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--hairline);
    padding:16px;
    margin-bottom:14px;
  }
  .num{
    font-family:'IBM Plex Mono',monospace;
  }
  .row{display:flex;justify-content:space-between;align-items:baseline;}
  select, input, textarea, button{
    font-family:'Inter',sans-serif;
    font-size:15px;
  }

  /* month switcher */
  .month-switch{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .month-switch button{
    background:none;border:1px solid var(--hairline);color:var(--paper);
    width:32px;height:32px;cursor:pointer;font-size:16px;
  }
  .month-switch .label{
    font-family:'Fraunces',serif;
    font-size:17px;
  }

  /* overview hero */
  .hero{
    border:1px solid var(--hairline);
    padding:20px;
    margin-bottom:14px;
    background:var(--panel);
  }
  .hero .net-label{color:var(--muted);font-size:12px;margin-bottom:6px;}
  .hero .net-value{
    font-family:'Fraunces',serif;
    font-size:38px;
    font-weight:600;
    line-height:1.05;
  }
  .hero .net-value.neg{color:var(--debt);}
  .hero .net-value.pos{color:var(--income);}
  .hero-sub{
    display:flex;
    margin-top:16px;
    border-top:1px solid var(--hairline);
    padding-top:14px;
    gap:0;
  }
  .hero-sub .cell{flex:1;}
  .hero-sub .cell + .cell{border-left:1px solid var(--hairline);padding-left:14px;margin-left:14px;}
  .hero-sub .cell .k{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .hero-sub .cell .v{font-family:'IBM Plex Mono',monospace;font-size:16px;}

  /* classification bars */
  .class-row{margin-bottom:12px;}
  .class-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .class-row .top .name{color:var(--paper);}
  .class-row .top .amt{font-family:'IBM Plex Mono',monospace;color:var(--muted);}
  .bar-track{height:6px;background:var(--hairline);width:100%;}
  .bar-fill{height:100%;}
  .bar-fill.growth{background:var(--growth);}
  .bar-fill.necessary{background:var(--necessary);}
  .bar-fill.flag{background:var(--flag);}

  /* transaction list */
  .tx{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid var(--hairline);
    gap:10px;
  }
  .tx:last-child{border-bottom:none;}
  .tx .left{flex:1;min-width:0;}
  .tx .tag{
    display:inline-block;
    font-size:10px;
    padding:2px 6px;
    margin-right:7px;
    border:1px solid var(--hairline);
    color:var(--muted);
    vertical-align:middle;
  }
  .tx .tag.growth{border-color:var(--growth);color:var(--growth);}
  .tx .tag.necessary{border-color:var(--necessary);color:var(--necessary);}
  .tx .tag.flag{border-color:var(--flag);color:var(--flag);}
  .tx .tag.income{border-color:var(--income);color:var(--income);}
  .tx .tag.saving{border-color:var(--muted);color:var(--muted);}
  .tx .note{font-size:14px;}
  .tx .meta{font-size:11px;color:var(--muted-dim);margin-top:2px;}
  .tx .amt{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    white-space:nowrap;
  }
  .tx .amt.in{color:var(--income);}
  .tx .amt.out{color:var(--paper);}
  .tx .del{
    background:none;border:none;color:var(--muted-dim);
    cursor:pointer;font-size:16px;padding:2px 4px;
  }
  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;}

  /* streams */
  .stream-card{
    border:1px solid var(--hairline);
    background:var(--panel);
    margin-bottom:12px;
    cursor:pointer;
  }
  .stream-card .head{
    display:flex;justify-content:space-between;align-items:center;
    padding:15px 16px;
  }
  .stream-card .head .name{font-family:'Fraunces',serif;font-size:17px;}
  .stream-card .head .net{font-family:'IBM Plex Mono',monospace;font-size:15px;}
  .stream-card .stats{
    display:flex;
    border-top:1px solid var(--hairline);
    padding:12px 16px;
    gap:20px;
  }
  .stream-card .stats .k{font-size:11px;color:var(--muted);}
  .stream-card .stats .v{font-family:'IBM Plex Mono',monospace;font-size:14px;margin-top:2px;}
  .stream-card .body{
    border-top:1px solid var(--hairline);
    padding:4px 16px 8px;
    display:none;
  }
  .stream-card.open .body{display:block;}

  /* debt */
  .debt-hero{
    border:1px solid var(--debt);
    background:var(--debt-dim);
    padding:20px;
    margin-bottom:14px;
  }
  .debt-hero .k{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .debt-hero .v{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--paper);}
  .progress-track{height:8px;background:var(--hairline);width:100%;margin-top:16px;}
  .progress-fill{height:100%;background:var(--debt);}
  .debt-hero .sub{margin-top:10px;font-size:12px;color:var(--muted);}
  .quick-pay{
    width:100%;
    padding:14px;
    background:var(--debt);
    color:var(--paper);
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:14px;
  }
  .setup-row{display:flex;gap:10px;align-items:center;}
  .setup-row input{flex:1;}

  /* forms */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;}
  .field input, .field select, .field textarea{
    width:100%;
    background:var(--panel-raised);
    border:1px solid var(--hairline);
    color:var(--paper);
    padding:12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--paper);
  }
  .type-toggle{
    display:flex;
    border:1px solid var(--hairline);
    margin-bottom:18px;
  }
  .type-toggle button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    padding:12px;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    border-right:1px solid var(--hairline);
  }
  .type-toggle button:last-child{border-right:none;}
  .type-toggle button.active{background:var(--panel-raised);color:var(--paper);}
  .class-toggle{display:flex;gap:8px;}
  .class-toggle button{
    flex:1;
    padding:12px 6px;
    border:1px solid var(--hairline);
    background:var(--panel-raised);
    color:var(--muted);
    cursor:pointer;
    font-size:13px;
  }
  .class-toggle button.active.growth{border-color:var(--growth);color:var(--growth);background:var(--growth-dim);}
  .class-toggle button.active.necessary{border-color:var(--necessary);color:var(--necessary);background:var(--necessary-dim);}
  .class-toggle button.active.flag{border-color:var(--flag);color:var(--flag);background:var(--flag-dim);}
  .submit-btn{
    width:100%;
    padding:15px;
    background:var(--paper);
    color:var(--ink);
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  .helper-text{font-size:12px;color:var(--muted-dim);margin-top:-10px;margin-bottom:16px;line-height:1.5;}

  /* bottom nav */
  nav.bottom{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--panel);
    border-top:1px solid var(--hairline);
    display:flex;
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted-dim);
    padding:13px 0 10px;
    font-size:11px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  nav.bottom button .dot{
    width:5px;height:5px;border-radius:50%;background:transparent;
  }
  nav.bottom button.active{color:var(--paper);}
  nav.bottom button.active .dot{background:var(--growth);}

  .toast{
    position:fixed;
    bottom:90px;left:50%;
    transform:translateX(-50%);
    background:var(--paper);
    color:var(--ink);
    padding:10px 18px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>The Ledger</h1>
    <p>Every cedi has a job. If it doesn't grow you, it doesn't leave.</p>
  </header>

  <main>
    <!-- OVERVIEW -->
    <section class="tab-panel active" id="tab-overview">
      <div class="month-switch">
        <button id="prevMonth">‹</button>
        <div class="label" id="monthLabel">—</div>
        <button id="nextMonth">›</button>
      </div>

      <div class="hero">
        <div class="net-label">Net position this month</div>
        <div class="net-value" id="netValue">GHS 0</div>
        <div class="hero-sub">
          <div class="cell"><div class="k">In</div><div class="v" id="sumIn">0</div></div>
          <div class="cell"><div class="k">Out</div><div class="v" id="sumOut">0</div></div>
          <div class="cell"><div class="k">Saved</div><div class="v" id="sumSaved">0</div></div>
        </div>
      </div>

      <div class="panel">
        <p class="section-label">Where the outflow went</p>
        <div id="classBreakdown"></div>
      </div>

      <div class="panel">
        <p class="section-label">Recent activity</p>
        <div id="recentList"></div>
      </div>
    </section>

    <!-- STREAMS -->
    <section class="tab-panel" id="tab-streams">
      <p class="section-label">Income streams — this month</p>
      <div id="streamsList"></div>
    </section>

    <!-- DEBT -->
    <section class="tab-panel" id="tab-debt">
      <div id="debtSetupArea"></div>
    </section>

    <!-- RENT -->
    <section class="tab-panel" id="tab-rent">
      <div id="rentSetupArea"></div>
    </section>

    <!-- ADD -->
    <section class="tab-panel" id="tab-add">
      <div class="type-toggle">
        <button data-type="expense" class="active">Expense</button>
        <button data-type="income">Income</button>
        <button data-type="saving">Saving</button>
      </div>

      <form id="txForm">
        <div class="field" id="streamField">
          <label id="streamLabel">Stream</label>
          <select id="streamInput"></select>
        </div>

        <div class="field" id="classField">
          <label>Does this bring more money?</label>
          <div class="class-toggle">
            <button type="button" data-class="growth">Growth</button>
            <button type="button" data-class="necessary" class="active necessary">Necessary</button>
            <button type="button" data-class="flag">Flag it</button>
          </div>
        </div>

        <div class="field" id="categoryField">
          <label>Category</label>
          <select id="categoryInput"></select>
        </div>

        <div class="field" id="savingCategoryField" style="display:none;">
          <label>What's this saving for?</label>
          <select id="savingCategoryInput"></select>
        </div>

        <div class="field">
          <label id="amountLabel">Amount (GHS)</label>
          <input type="number" id="amountInput" inputmode="decimal" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="field">
          <label>Note</label>
          <input type="text" id="noteInput" placeholder="What was this for?">
        </div>

        <div class="field">
          <label>Date</label>
          <input type="date" id="dateInput">
        </div>

        <p class="helper-text" id="helperText"></p>
        <button type="submit" class="submit-btn" id="submitBtn">Record it</button>
      </form>
    </section>
  </main>

  <nav class="bottom">
    <button class="nav-btn active" data-tab="overview"><span class="dot"></span>Overview</button>
    <button class="nav-btn" data-tab="streams"><span class="dot"></span>Streams</button>
    <button class="nav-btn" data-tab="debt"><span class="dot"></span>Debt</button>
    <button class="nav-btn" data-tab="rent"><span class="dot"></span>Rent</button>
    <button class="nav-btn" data-tab="add"><span class="dot"></span>Add</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  // Falls back to localStorage when running outside Claude (e.g. on GitHub Pages),
  // where window.storage isn't available. Inside Claude.ai it uses the real thing.
  if(!window.storage){
    window.storage = {
      async get(key){
        const raw = localStorage.getItem(key);
        if(raw===null) throw new Error('not found');
        return { key, value: raw };
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return { key, value };
      },
      async delete(key){
        localStorage.removeItem(key);
        return { key, deleted:true };
      },
      async list(prefix){
        const keys = Object.keys(localStorage).filter(k=> !prefix || k.startsWith(prefix));
        return { keys };
      }
    };
  }

  const STREAMS = ["Lestrades Main","Lestrades iShop","Braketime pub & grill","Lestrades Offshore","Salary"];
  const EXPENSE_CATEGORIES = [
    "Family upkeep","Family expense","School fees","Fuel & T&T","Rent",
    "Home keeping","Emergency fund","Debt repayment","Business supplies","Reinvestment","Other"
  ];
  const SAVING_CATEGORIES = ["General savings","Rent fund","Emergency fund","Tithe"];
  const AUTO_SPLIT_STREAMS = ["Lestrades Offshore","Salary"]; // 10% emergency + 10% tithe, automatically
  const REINVEST_STREAMS = ["Lestrades Offshore"]; // additional 70% reinvested into the business

  let transactions = [];
  let debtInfo = { debts: [] };
  let rentInfo = { annualAmount: 0 };
  let currentTab = "overview";
  let currentType = "expense";
  let currentClass = "necessary";
  let viewMonth = new Date().getMonth();
  let viewYear = new Date().getFullYear();
  let dataReady = false;

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => "GHS " + Number(n||0).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtShort = (n) => Number(n||0).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});

  function showToast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1600);
  }

  // ---------- STORAGE ----------
  async function loadData(){
    try{
      const res = await window.storage.get('transactions', false);
      transactions = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ transactions = []; }
    try{
      const res = await window.storage.get('debtInfo', false);
      const parsed = res && res.value ? JSON.parse(res.value) : null;
      if(parsed && Array.isArray(parsed.debts)){
        debtInfo = parsed;
      } else if(parsed && parsed.totalOwed){
        // migrate legacy single-debt shape
        debtInfo = { debts: [{ id: Date.now(), name: "Debt", totalOwed: parsed.totalOwed, typicalPayment: 10000 }] };
      } else {
        debtInfo = { debts: [] };
      }
    }catch(e){ debtInfo = { debts: [] }; }
    try{
      const res = await window.storage.get('rentInfo', false);
      rentInfo = res && res.value ? JSON.parse(res.value) : { annualAmount: 0 };
    }catch(e){ rentInfo = { annualAmount: 0 }; }
    dataReady = true;
  }
  async function saveTransactions(){
    try{ await window.storage.set('transactions', JSON.stringify(transactions), false); }
    catch(e){ showToast("Couldn't save — try again"); }
  }
  async function saveDebtInfo(){
    try{ await window.storage.set('debtInfo', JSON.stringify(debtInfo), false); }
    catch(e){ showToast("Couldn't save — try again"); }
  }
  async function saveRentInfo(){
    try{ await window.storage.set('rentInfo', JSON.stringify(rentInfo), false); }
    catch(e){ showToast("Couldn't save — try again"); }
  }

  // ---------- HELPERS ----------
  function monthTx(){
    return transactions.filter(t=>{
      const d = new Date(t.date+"T00:00:00");
      return d.getMonth()===viewMonth && d.getFullYear()===viewYear;
    });
  }
  function monthLabelStr(){
    return new Date(viewYear, viewMonth, 1).toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  }

  // ---------- RENDER: OVERVIEW ----------
  function renderOverview(){
    $("monthLabel").textContent = monthLabelStr();
    const tx = monthTx();
    const income = tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const saved = tx.filter(t=>t.type==='saving').reduce((s,t)=>s+t.amount,0);
    const net = income - expense - saved;

    const netEl = $("netValue");
    netEl.textContent = (net<0?"-":"") + fmt(Math.abs(net));
    netEl.className = "net-value " + (net<0?"neg":"pos");

    $("sumIn").textContent = fmtShort(income);
    $("sumOut").textContent = fmtShort(expense);
    $("sumSaved").textContent = fmtShort(saved);

    const growth = tx.filter(t=>t.type==='expense'&&t.classification==='growth').reduce((s,t)=>s+t.amount,0);
    const necessary = tx.filter(t=>t.type==='expense'&&t.classification==='necessary').reduce((s,t)=>s+t.amount,0);
    const flag = tx.filter(t=>t.type==='expense'&&t.classification==='flag').reduce((s,t)=>s+t.amount,0);
    const total = growth+necessary+flag || 1;

    const rows = [
      {name:"Growth — pays me back", val:growth, cls:"growth"},
      {name:"Necessary — keeps things running", val:necessary, cls:"necessary"},
      {name:"Flagged — review this", val:flag, cls:"flag"}
    ];
    $("classBreakdown").innerHTML = rows.map(r=>`
      <div class="class-row">
        <div class="top"><span class="name">${r.name}</span><span class="amt">${fmtShort(r.val)}</span></div>
        <div class="bar-track"><div class="bar-fill ${r.cls}" style="width:${(r.val/total*100).toFixed(1)}%"></div></div>
      </div>
    `).join("") || `<p class="empty-note">No expenses logged yet.</p>`;

    const recent = tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,8);
    $("recentList").innerHTML = recent.length ? recent.map(txRowHTML).join("") : `<p class="empty-note">Nothing recorded this month yet.</p>`;
    attachDeleteHandlers("recentList");
  }

  function txRowHTML(t){
    let tagClass = t.type==='income' ? 'income' : (t.type==='saving' ? 'saving' : t.classification);
    let tagText = t.type==='income' ? 'IN' : (t.type==='saving' ? 'SAVED' : t.classification.toUpperCase());
    let sub = t.type==='income' ? t.stream : (t.category==='Debt repayment' && t.debtName ? `Debt: ${t.debtName}` : (t.category||''));
    let amtClass = t.type==='income' ? 'in' : 'out';
    let sign = t.type==='income' ? '+' : '−';
    return `
      <div class="tx" data-id="${t.id}">
        <div class="left">
          <div class="note"><span class="tag ${tagClass}">${tagText}</span>${t.note ? escapeHTML(t.note) : sub}</div>
          <div class="meta">${sub}${t.note?" · "+sub:""} · ${t.date}</div>
        </div>
        <div class="amt ${amtClass}">${sign}${fmtShort(t.amount)}</div>
        <button class="del" data-id="${t.id}" title="Delete">✕</button>
      </div>
    `;
  }
  function escapeHTML(s){
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }
  function attachDeleteHandlers(containerId){
    document.querySelectorAll(`#${containerId} .del`).forEach(btn=>{
      btn.onclick = async (e)=>{
        const id = Number(e.currentTarget.dataset.id);
        transactions = transactions.filter(t=>t.id!==id);
        await saveTransactions();
        renderAll();
        showToast("Removed");
      };
    });
  }

  // ---------- RENDER: STREAMS ----------
  function renderStreams(){
    const tx = monthTx();
    const html = STREAMS.map(stream=>{
      const streamTx = tx.filter(t=>t.stream===stream);
      const income = streamTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const expense = streamTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      const net = income - expense;
      const rows = streamTx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(txRowHTML).join("");
      return `
        <div class="stream-card" data-stream="${stream}">
          <div class="head">
            <div class="name">${stream}</div>
            <div class="net num" style="color:${net<0?'var(--debt)':'var(--income)'}">${net<0?'-':''}${fmt(Math.abs(net))}</div>
          </div>
          <div class="stats">
            <div><div class="k">In</div><div class="v">${fmtShort(income)}</div></div>
            <div><div class="k">Out</div><div class="v">${fmtShort(expense)}</div></div>
            <div><div class="k">Entries</div><div class="v">${streamTx.length}</div></div>
          </div>
          <div class="body">${rows || '<p class="empty-note">No activity yet this month.</p>'}</div>
        </div>
      `;
    }).join("");
    $("streamsList").innerHTML = html;

    document.querySelectorAll(".stream-card .head").forEach(head=>{
      head.onclick = ()=>{
        head.parentElement.classList.toggle("open");
      };
    });
    document.querySelectorAll('.stream-card .del').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const id = Number(e.currentTarget.dataset.id);
        transactions = transactions.filter(t=>t.id!==id);
        await saveTransactions();
        renderAll();
        showToast("Removed");
      };
    });
  }

  // ---------- RENDER: DEBT ----------
  function debtPaid(debtId){
    return transactions.filter(t=>t.type==='expense' && t.category==='Debt repayment' && t.debtId===debtId)
      .reduce((s,t)=>s+t.amount,0);
  }

  function renderDebt(){
    const debts = debtInfo.debts || [];
    const totalOwedAll = debts.reduce((s,d)=>s+d.totalOwed,0);
    const totalPaidAll = debts.reduce((s,d)=>s+debtPaid(d.id),0);
    const totalRemainingAll = Math.max(totalOwedAll - totalPaidAll, 0);

    let html = "";

    if(debts.length){
      html += `
        <div class="panel">
          <p class="section-label">Owed across everyone</p>
          <div class="net-value" style="font-size:28px;color:var(--debt);">${fmt(totalRemainingAll)}</div>
        </div>
      `;
    }

    html += debts.map(d=>{
      const paid = debtPaid(d.id);
      const remaining = Math.max(d.totalOwed - paid, 0);
      const pct = d.totalOwed>0 ? Math.min((paid/d.totalOwed)*100,100) : 0;
      const payments = transactions.filter(t=>t.type==='expense' && t.category==='Debt repayment' && t.debtId===d.id)
        .slice().sort((a,b)=>b.date.localeCompare(a.date));
      return `
        <div class="panel debt-card" data-debtid="${d.id}">
          <div class="row" style="margin-bottom:10px;">
            <div class="name" style="font-family:'Fraunces',serif;font-size:17px;">${escapeHTML(d.name)}</div>
            <div class="num" style="font-size:16px;color:var(--debt);">${fmt(remaining)}</div>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct.toFixed(1)}%"></div></div>
          <div class="row" style="font-size:11px;color:var(--muted);margin-top:6px;margin-bottom:14px;">
            <span>${fmt(paid)} paid of ${fmt(d.totalOwed)}</span><span>${pct.toFixed(0)}% cleared</span>
          </div>
          <div class="setup-row" style="margin-bottom:14px;">
            <input type="number" class="debt-pay-input" data-debtid="${d.id}" placeholder="Amount" value="${d.typicalPayment || ''}">
            <button type="button" class="submit-btn debt-pay-btn" data-debtid="${d.id}" style="width:auto;padding:12px 16px;background:var(--debt);color:var(--paper);">Log payment</button>
          </div>
          <p class="section-label">Payment history</p>
          <div class="debt-history" data-debtid="${d.id}">${payments.length ? payments.map(txRowHTML).join("") : '<p class="empty-note">No payments logged yet.</p>'}</div>
          <button type="button" class="del-debt" data-debtid="${d.id}" style="background:none;border:none;color:var(--muted-dim);font-size:12px;margin-top:12px;cursor:pointer;padding:0;">Remove this debt</button>
        </div>
      `;
    }).join("");

    html += `
      <div class="panel">
        <p class="section-label">${debts.length ? "Add another debt" : "Add your first debt"}</p>
        <div class="field">
          <label>Who or what do you owe?</label>
          <input type="text" id="newDebtName" placeholder="e.g. Mensah, bank loan, supplier credit">
        </div>
        <div class="field">
          <label>Total amount owed (GHS)</label>
          <input type="number" id="newDebtTotal" placeholder="e.g. 120000" min="0">
        </div>
        <div class="field">
          <label>Usual payment amount (optional)</label>
          <input type="number" id="newDebtTypical" placeholder="e.g. 10000" min="0">
        </div>
        <button class="submit-btn" id="addDebtBtn">Add debt</button>
      </div>
    `;

    $("debtSetupArea").innerHTML = html;

    $("addDebtBtn").onclick = async ()=>{
      const name = $("newDebtName").value.trim();
      const total = parseFloat($("newDebtTotal").value);
      const typical = parseFloat($("newDebtTypical").value) || null;
      if(!name){ showToast("Give this debt a name"); return; }
      if(!total || total<=0){ showToast("Enter the total owed"); return; }
      debtInfo.debts = debtInfo.debts || [];
      debtInfo.debts.push({ id: Date.now(), name, totalOwed: total, typicalPayment: typical });
      await saveDebtInfo();
      renderDebt();
      showToast("Debt added");
    };

    document.querySelectorAll(".debt-pay-btn").forEach(btn=>{
      btn.onclick = async ()=>{
        const id = Number(btn.dataset.debtid);
        const input = document.querySelector(`.debt-pay-input[data-debtid="${id}"]`);
        const amount = parseFloat(input.value);
        if(!amount || amount<=0){ showToast("Enter an amount"); return; }
        const debt = (debtInfo.debts||[]).find(d=>d.id===id);
        transactions.push({
          id: Date.now(),
          type: 'expense',
          classification: 'necessary',
          category: 'Debt repayment',
          debtId: id,
          debtName: debt ? debt.name : '',
          stream: 'Personal',
          amount,
          note: `Payment — ${debt ? debt.name : ''}`,
          date: new Date().toISOString().slice(0,10)
        });
        await saveTransactions();
        renderAll();
        showToast("Payment logged");
      };
    });

    document.querySelectorAll(".del-debt").forEach(btn=>{
      btn.onclick = async ()=>{
        const id = Number(btn.dataset.debtid);
        if(btn.dataset.confirming==='1'){
          debtInfo.debts = (debtInfo.debts||[]).filter(d=>d.id!==id);
          await saveDebtInfo();
          renderDebt();
          showToast("Debt removed");
        } else {
          btn.dataset.confirming = '1';
          btn.textContent = 'Tap again to confirm removal';
          setTimeout(()=>{ btn.dataset.confirming=''; btn.textContent='Remove this debt'; }, 3000);
        }
      };
    });

    document.querySelectorAll(".debt-history .del").forEach(delBtn=>{
      delBtn.onclick = async (e)=>{
        const txId = Number(e.currentTarget.dataset.id);
        transactions = transactions.filter(t=>t.id!==txId);
        await saveTransactions();
        renderAll();
        showToast("Removed");
      };
    });
  }

  // ---------- RENDER: RENT ----------
  function renderRent(){
    const saved = transactions.filter(t=>t.type==='saving' && t.category==='Rent fund').reduce((s,t)=>s+t.amount,0);
    const paidPayments = transactions.filter(t=>t.type==='expense' && t.category==='Rent')
      .slice().sort((a,b)=>b.date.localeCompare(a.date));
    const target = rentInfo.annualAmount || 0;

    if(!target){
      $("rentSetupArea").innerHTML = `
        <div class="panel">
          <p class="section-label">Set up your rent fund</p>
          <p class="helper-text" style="margin-top:0;">You pay rent every November. Set the amount so you can save toward it in pieces instead of finding it all at once.</p>
          <div class="field">
            <label>Rent amount due (GHS)</label>
            <input type="number" id="rentTotalInput" placeholder="e.g. 60000" min="0">
          </div>
          <button class="submit-btn" id="saveRentBtn">Start rent fund</button>
        </div>
      `;
      $("saveRentBtn").onclick = async ()=>{
        const val = parseFloat($("rentTotalInput").value);
        if(!val || val<=0){ showToast("Enter the rent amount"); return; }
        rentInfo.annualAmount = val;
        await saveRentInfo();
        renderRent();
        showToast("Rent fund started");
      };
      return;
    }

    const remaining = Math.max(target - saved, 0);
    const pct = target>0 ? Math.min((saved/target)*100,100) : 0;
    const fundEntries = transactions.filter(t=>t.type==='saving' && t.category==='Rent fund')
      .slice().sort((a,b)=>b.date.localeCompare(a.date));

    $("rentSetupArea").innerHTML = `
      <div class="debt-hero" style="border-color:var(--growth);background:var(--growth-dim);">
        <div class="k">Still need to save</div>
        <div class="v">${fmt(remaining)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct.toFixed(1)}%;background:var(--growth);"></div></div>
        <div class="sub">${fmt(saved)} saved toward ${fmt(target)} due in November · ${pct.toFixed(0)}% there</div>
      </div>
      <div class="panel">
        <p class="section-label">Add to the rent fund</p>
        <div class="setup-row">
          <input type="number" id="rentAddInput" placeholder="Amount">
          <button class="submit-btn" id="rentAddBtn" style="width:auto;padding:12px 16px;background:var(--growth);color:var(--paper);">Add</button>
        </div>
      </div>
      <div class="panel">
        <p class="section-label">Rent fund history</p>
        <div id="rentFundHistory">${fundEntries.length ? fundEntries.map(txRowHTML).join("") : '<p class="empty-note">No contributions logged yet.</p>'}</div>
      </div>
      <div class="panel">
        <p class="section-label">Actual rent payments</p>
        <div id="rentPaymentHistory">${paidPayments.length ? paidPayments.map(txRowHTML).join("") : '<p class="empty-note">No rent payments logged yet. Log one as an Expense in November.</p>'}</div>
      </div>
      <div class="panel">
        <p class="section-label">Adjust rent amount</p>
        <div class="setup-row">
          <input type="number" id="rentTotalEdit" value="${target}">
          <button class="submit-btn" id="updateRentBtn" style="width:auto;padding:12px 16px;">Update</button>
        </div>
      </div>
    `;

    $("rentAddBtn").onclick = async ()=>{
      const val = parseFloat($("rentAddInput").value);
      if(!val || val<=0){ showToast("Enter an amount"); return; }
      transactions.push({
        id: Date.now(),
        type: 'saving',
        category: 'Rent fund',
        stream: 'Personal',
        amount: val,
        note: 'Rent fund contribution',
        date: new Date().toISOString().slice(0,10)
      });
      await saveTransactions();
      renderAll();
      showToast("Added to rent fund");
    };
    $("updateRentBtn").onclick = async ()=>{
      const val = parseFloat($("rentTotalEdit").value);
      if(!val || val<=0){ showToast("Enter a valid amount"); return; }
      rentInfo.annualAmount = val;
      await saveRentInfo();
      renderRent();
      showToast("Updated");
    };
    attachDeleteHandlers("rentFundHistory");
    attachDeleteHandlers("rentPaymentHistory");
  }

  // ---------- ADD FORM ----------
  function populateStreamSelect(){
    const sel = $("streamInput");
    if(currentType==='income'){
      sel.innerHTML = STREAMS.map(s=>`<option value="${s}">${s}</option>`).join("");
    } else {
      sel.innerHTML = ['Personal', ...STREAMS].map(s=>`<option value="${s}">${s}</option>`).join("");
    }
  }
  function populateCategorySelect(){
    $("categoryInput").innerHTML = EXPENSE_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
    $("savingCategoryInput").innerHTML = SAVING_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
  }

  function updateFormForType(){
    $("streamLabel").textContent = currentType==='income' ? "Which stream is this from?" : "Which stream funds this?";
    $("streamField").style.display = 'block';
    $("classField").style.display = currentType==='expense' ? 'block' : 'none';
    $("categoryField").style.display = currentType==='expense' ? 'block' : 'none';
    $("savingCategoryField").style.display = currentType==='saving' ? 'block' : 'none';
    $("amountLabel").textContent = "Amount (GHS)";

    let helper = "";
    if(currentType==='income') helper = "Recorded — this isn't free cash, it has a purpose the moment it lands. Offshore and Salary income auto-split: 10% emergency fund, 10% tithe; Offshore also reinvests 70% into the business.";
    if(currentType==='expense') helper = "Before you record this: will it bring more money back to you?";
    if(currentType==='saving') helper = "Money set aside on purpose, not what happens to be left over. Tip: use the Rent tab directly to add to your rent fund.";
    $("helperText").textContent = helper;

    if(currentType!=='expense'){
      $("noteInput").placeholder = currentType==='income' ? "e.g. weekly payout, deal commission" : "What is this saving for?";
    } else {
      $("noteInput").placeholder = "What was this for?";
    }
  }

  document.querySelectorAll(".type-toggle button").forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(".type-toggle button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentType = btn.dataset.type;
      populateStreamSelect();
      updateFormForType();
    };
  });

  document.querySelectorAll(".class-toggle button").forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(".class-toggle button").forEach(b=>b.classList.remove("active","growth","necessary","flag"));
      btn.classList.add("active", btn.dataset.class);
      currentClass = btn.dataset.class;
    };
  });

  $("txForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const amount = parseFloat($("amountInput").value);
    if(!amount || amount<=0){ showToast("Enter an amount"); return; }
    const date = $("dateInput").value || new Date().toISOString().slice(0,10);
    const note = $("noteInput").value.trim();
    const stream = $("streamInput").value;

    const t = {
      id: Date.now(),
      type: currentType,
      date, note, stream,
      amount
    };
    if(currentType==='expense'){
      t.classification = currentClass;
      t.category = $("categoryInput").value;
    }
    if(currentType==='saving'){
      t.category = $("savingCategoryInput").value;
    }
    transactions.push(t);

    let autoNote = "";
    if(currentType==='income' && AUTO_SPLIT_STREAMS.includes(stream)){
      const emergency = +(amount*0.10).toFixed(2);
      const tithe = +(amount*0.10).toFixed(2);
      const idBase = Date.now();
      transactions.push({
        id: idBase+1, type:'saving', category:'Emergency fund', stream,
        amount: emergency, note:`Auto 10% from ${stream}`, date
      });
      transactions.push({
        id: idBase+2, type:'saving', category:'Tithe', stream,
        amount: tithe, note:`Auto 10% from ${stream}`, date
      });
      autoNote = ` · 10% to emergency, 10% to tithe`;

      if(REINVEST_STREAMS.includes(stream)){
        const reinvest = +(amount*0.70).toFixed(2);
        transactions.push({
          id: idBase+3, type:'expense', classification:'growth', category:'Reinvestment', stream,
          amount: reinvest, note:`Auto 70% reinvested from ${stream}`, date
        });
        autoNote = ` · 20% set aside, 70% reinvested`;
      }
    }

    await saveTransactions();
    showToast("Recorded" + autoNote);
    $("amountInput").value = "";
    $("noteInput").value = "";
    viewMonth = new Date(date+"T00:00:00").getMonth();
    viewYear = new Date(date+"T00:00:00").getFullYear();
    switchTab("overview");
  });

  // ---------- NAV ----------
  function switchTab(tab){
    currentTab = tab;
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    $("tab-"+tab).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
    renderAll();
  }
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.onclick = ()=>switchTab(btn.dataset.tab);
  });

  $("prevMonth").onclick = ()=>{
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
    renderOverview();
  };
  $("nextMonth").onclick = ()=>{
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
    renderOverview();
  };

  function renderAll(){
    if(!dataReady) return;
    if(currentTab==='overview') renderOverview();
    if(currentTab==='streams') renderStreams();
    if(currentTab==='debt') renderDebt();
    if(currentTab==='rent') renderRent();
  }

  // ---------- INIT ----------
  async function init(){
    $("dateInput").value = new Date().toISOString().slice(0,10);
    populateStreamSelect();
    populateCategorySelect();
    updateFormForType();
    await loadData();
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
